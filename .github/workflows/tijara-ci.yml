      TIJARA_OFFLINE_QUEUE_SNAPSHOT_POS_CONFIG_ID: ${{ vars.TIJARA_OFFLINE_QUEUE_SNAPSHOT_POS_CONFIG_ID || vars.TIJARA_POS_CONFIG_ID }}
      TIJARA_OFFLINE_PILOT_OUTAGE_REF: ${{ vars.TIJARA_OFFLINE_PILOT_OUTAGE_REF }}
      TIJARA_OFFLINE_PILOT_RECOVERY_OWNER: ${{ vars.TIJARA_OFFLINE_PILOT_RECOVERY_OWNER }}
      TIJARA_OFFLINE_PILOT_STORE_REF: ${{ vars.TIJARA_OFFLINE_PILOT_STORE_REF }}
      TIJARA_OFFLINE_PILOT_REGISTER_REF: ${{ vars.TIJARA_OFFLINE_PILOT_REGISTER_REF }}
      TIJARA_OFFLINE_PILOT_SOURCE_DEVICE_ID: ${{ vars.TIJARA_OFFLINE_PILOT_SOURCE_DEVICE_ID }}
      TIJARA_OFFLINE_PILOT_QUEUE_STATUS_JSON: ${{ vars.TIJARA_OFFLINE_PILOT_QUEUE_STATUS_JSON }}
      TIJARA_OFFLINE_PILOT_QUEUED_COUNT: ${{ vars.TIJARA_OFFLINE_PILOT_QUEUED_COUNT }}
      TIJARA_OFFLINE_PILOT_VALIDATED_COUNT: ${{ vars.TIJARA_OFFLINE_PILOT_VALIDATED_COUNT }}
