name: Tijara CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      protected_release:
        description: "Run the protected staging/production evidence profile"
        required: true
        type: boolean
        default: false
      target_environment:
        description: "Protected environment to evaluate"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      run_id:
        description: "Optional evidence run ID"
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate scaffold
        run: bash scripts/validate_scaffold.sh
      - name: Check JavaScript syntax
        run: bash scripts/js_check.sh
      - name: Security audit baseline
        run: bash scripts/security_audit.sh
      - name: Validate compose config
        run: docker compose --env-file .env.example --env-file secrets/.env.secrets.example config --quiet
      - name: Local release candidate gate
        run: TIJARA_RELEASE_RUN_ID=ci-local TIJARA_RELEASE_CHECKS=local make release-candidate
      - name: Local release retention evidence
        run: |
          python3 scripts/export_release_retention_evidence.py \
            --run-id ci-local \
            --target-environment ci \
            --output deploy/runtime/release-retention-evidence/ci-local \
            --artifact-store-reference github-actions:tijara-ci-release-evidence \
            --artifact-retention-policy-ref github-actions:retention-days-30 \
            --certification-retention-policy-ref docs:DEPLOY.md#external-certification-evidence-intake \
            --secret-manager-provider github-actions-secrets \
            --secret-manager-reference github-actions:tijara-ci \
            --secret-rotation-policy-ref docs:DEPLOY.md#secret-handling \
            --ci-artifact-retention-days 30 \
            --release-evidence-retention-days 365 \
            --certification-evidence-retention-days 365 \
            --log-retention-days 30 \
            --backup-retention-days 30 \
            --evidence-path deploy/runtime/release-evidence/ci-local \
            --strict
      - name: Local secret manager evidence
        run: |
          python3 scripts/export_secret_manager_evidence.py \
            --run-id ci-local \
            --target-environment ci \
            --output deploy/runtime/secret-manager-evidence/ci-local \
            --secret-manager-provider github-actions-secrets \
            --secret-manager-reference github-actions:tijara-ci \
            --secret-rotation-policy-ref docs:DEPLOY.md#secret-handling \
            --secret-access-review-ref docs:DEPLOY.md#secret-handling \
            --strict
      - name: Local Browser E2E readiness evidence
        run: |
          python3 scripts/export_e2e_readiness.py \
            --run-id ci-local \
            --scope ci-browser-baseline \
            --base-url http://localhost:8069 \
            --output deploy/runtime/e2e-evidence/ci-local \
            --spec tests/e2e/pos-checkout-print.spec.mjs \
            --spec tests/e2e/refunds-reports.spec.mjs \
            --spec tests/e2e/pos-enterprise-journey.spec.mjs
      - name: Local production operations readiness evidence
        run: |
          python3 scripts/export_production_ops_readiness.py \
            --run-id ci-local \
            --target-environment ci \
            --output deploy/runtime/production-ops-readiness/ci-local \
            --release-retention-evidence deploy/runtime/release-retention-evidence/ci-local/release-retention-evidence.json \
            --secret-manager-evidence deploy/runtime/secret-manager-evidence/ci-local/secret-manager-evidence.json \
            --backup-artifact-ref github-actions:tijara-ci/no-production-backup \
            --restore-drill-ref github-actions:tijara-ci/no-production-restore \
            --security-audit-ref github-actions:tijara-ci/security-audit \
            --dependency-scan-ref github-actions:tijara-ci/dependency-scan
      - name: Generate CI sign-off package
        run: |
          TIJARA_SIGNOFF_RUN_ID=ci-local \
          TIJARA_SIGNOFF_ENVIRONMENT=ci \
          TIJARA_SIGNOFF_EVIDENCE_PATHS=deploy/runtime/release-evidence/ci-local,deploy/runtime/e2e-evidence/ci-local,deploy/runtime/release-retention-evidence/ci-local,deploy/runtime/secret-manager-evidence/ci-local,deploy/runtime/production-ops-readiness/ci-local \
          TIJARA_SIGNOFF_REQUIRED_EVIDENCE_GROUPS=release,e2e,ops,security \
          TIJARA_SIGNOFF_STRICT_REQUIRED_EVIDENCE=1 \
          make signoff-pack
      - name: Check CI release readiness
        run: make check-release-readiness READINESS=deploy/runtime/signoff-packages/ci-local/release-readiness.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tijara-ci-release-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            deploy/runtime/release-evidence/ci-local
            deploy/runtime/e2e-evidence/ci-local
            deploy/runtime/release-retention-evidence/ci-local
            deploy/runtime/secret-manager-evidence/ci-local
            deploy/runtime/production-ops-readiness/ci-local
            deploy/runtime/signoff-packages/ci-local

  protected-release-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.protected_release }}
    runs-on: [self-hosted, tijara-protected]
    environment: ${{ inputs.target_environment }}
    env:
      TIJARA_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      TIJARA_PROTECTED_RELEASE_CHECKS: ${{ vars.TIJARA_PROTECTED_RELEASE_CHECKS || 'full' }}
      TIJARA_PROTECTED_REQUIRED_EVIDENCE_GROUPS: ${{ vars.TIJARA_PROTECTED_REQUIRED_EVIDENCE_GROUPS || 'release,e2e,ops,security' }}
      TIJARA_PROTECTED_CERTIFICATION_GROUPS: ${{ vars.TIJARA_PROTECTED_CERTIFICATION_GROUPS || '' }}
      TIJARA_FIRST_RUN_RELEASE_OWNER: ${{ vars.TIJARA_FIRST_RUN_RELEASE_OWNER }}
      TIJARA_FIRST_RUN_DEVOPS_OWNER: ${{ vars.TIJARA_FIRST_RUN_DEVOPS_OWNER }}
      TIJARA_FIRST_RUN_QA_OWNER: ${{ vars.TIJARA_FIRST_RUN_QA_OWNER }}
      TIJARA_FIRST_RUN_BUSINESS_OWNER: ${{ vars.TIJARA_FIRST_RUN_BUSINESS_OWNER }}
      TIJARA_FIRST_RUN_SECURITY_OWNER: ${{ vars.TIJARA_FIRST_RUN_SECURITY_OWNER }}
      TIJARA_FIRST_RUN_SUPPORT_OWNER: ${{ vars.TIJARA_FIRST_RUN_SUPPORT_OWNER }}
      TIJARA_FIRST_RUN_FINANCE_OWNER: ${{ vars.TIJARA_FIRST_RUN_FINANCE_OWNER }}
      TIJARA_FIRST_RUN_TAX_OWNER: ${{ vars.TIJARA_FIRST_RUN_TAX_OWNER }}
      TIJARA_FIRST_RUN_HARDWARE_OWNER: ${{ vars.TIJARA_FIRST_RUN_HARDWARE_OWNER }}
      TIJARA_FIRST_RUN_GITHUB_ENVIRONMENT: ${{ vars.TIJARA_FIRST_RUN_GITHUB_ENVIRONMENT || inputs.target_environment }}
      TIJARA_FIRST_RUN_RUNNER_LABELS: ${{ vars.TIJARA_FIRST_RUN_RUNNER_LABELS || 'self-hosted,tijara-protected' }}
      TIJARA_FIRST_RUN_REQUIRED_RUNNER_LABELS: ${{ vars.TIJARA_FIRST_RUN_REQUIRED_RUNNER_LABELS || 'self-hosted,tijara-protected' }}
      TIJARA_FIRST_RUN_STAGING_URL: ${{ vars.TIJARA_FIRST_RUN_STAGING_URL || vars.ODOO_BASE_URL || vars.TIJARA_BASE_URL }}
      TIJARA_FIRST_RUN_PROTECTED_WORKFLOW_REF: ${{ vars.TIJARA_FIRST_RUN_PROTECTED_WORKFLOW_REF || 'workflow:tijara-ci/protected-release-evidence' }}
      TIJARA_FIRST_RUN_CHANGE_TICKET_REF: ${{ vars.TIJARA_FIRST_RUN_CHANGE_TICKET_REF }}
      TIJARA_FIRST_RUN_ROLLBACK_PLAN_REF: ${{ vars.TIJARA_FIRST_RUN_ROLLBACK_PLAN_REF }}
      TIJARA_FIRST_RUN_INCIDENT_CHANNEL_REF: ${{ vars.TIJARA_FIRST_RUN_INCIDENT_CHANNEL_REF }}
      TIJARA_FIRST_RUN_BACKUP_REF: ${{ vars.TIJARA_FIRST_RUN_BACKUP_REF || vars.TIJARA_BACKUP_ARTIFACT_REF }}
      TIJARA_FIRST_RUN_EXPECTED_ARTIFACTS: ${{ vars.TIJARA_FIRST_RUN_EXPECTED_ARTIFACTS || 'protected-runbook-handoff,protected-first-run,protected-runner-preflight,release-evidence,protected-e2e,e2e-seed,e2e-profile,e2e-evidence,e2e-execution,ops-tool-evidence,certification-evidence,release-retention-evidence,secret-manager-evidence,production-ops-readiness,signoff-packages,protected-post-run-verification,protected-artifact-summary' }}
      TIJARA_FIRST_RUN_REQUIRE_CERTIFICATIONS: ${{ vars.TIJARA_FIRST_RUN_REQUIRE_CERTIFICATIONS || '0' }}
      TIJARA_RUNBOOK_ARTIFACT_REVIEW_ORDER: ${{ vars.TIJARA_RUNBOOK_ARTIFACT_REVIEW_ORDER || 'protected-runbook-handoff,protected-first-run,protected-runner-preflight,protected-artifact-summary,release-evidence,protected-e2e,e2e-execution,ops-tool-evidence,certification-evidence,release-retention-evidence,secret-manager-evidence,production-ops-readiness,signoff-packages' }}
      TIJARA_POST_RUN_REQUIRED_ARTIFACTS: ${{ vars.TIJARA_POST_RUN_REQUIRED_ARTIFACTS || 'protected-runbook-handoff,protected-first-run,protected-runner-preflight,release-evidence,protected-e2e,ops-tool-evidence,certification-evidence,release-retention-evidence,secret-manager-evidence,production-ops-readiness,signoff-packages' }}
      TIJARA_PREFLIGHT_PROBE_URLS: ${{ vars.TIJARA_PREFLIGHT_PROBE_URLS || '0' }}
      TIJARA_PREFLIGHT_REQUIRE_URLS: ${{ vars.TIJARA_PREFLIGHT_REQUIRE_URLS || '0' }}
      TIJARA_PREFLIGHT_PROBE_TIMEOUT: ${{ vars.TIJARA_PREFLIGHT_PROBE_TIMEOUT || '5' }}
      TIJARA_PREFLIGHT_AUTH_PROBES: ${{ vars.TIJARA_PREFLIGHT_AUTH_PROBES || '0' }}
      TIJARA_PREFLIGHT_REQUIRE_AUTH: ${{ vars.TIJARA_PREFLIGHT_REQUIRE_AUTH || '0' }}
      TIJARA_PREFLIGHT_ODOO_AUTH_HEADER: ${{ vars.TIJARA_PREFLIGHT_ODOO_AUTH_HEADER }}
      TIJARA_PREFLIGHT_ODOO_AUTH_VALUE_ENV: ${{ vars.TIJARA_PREFLIGHT_ODOO_AUTH_VALUE_ENV }}
      TIJARA_PREFLIGHT_BRIDGE_AUTH_HEADER: ${{ vars.TIJARA_PREFLIGHT_BRIDGE_AUTH_HEADER || 'X-Tijara-Bridge-Secret' }}
      TIJARA_PREFLIGHT_BRIDGE_AUTH_VALUE_ENV: ${{ vars.TIJARA_PREFLIGHT_BRIDGE_AUTH_VALUE_ENV || 'TIJARA_BRIDGE_SHARED_SECRET' }}
      TIJARA_PREFLIGHT_PROMETHEUS_AUTH_HEADER: ${{ vars.TIJARA_PREFLIGHT_PROMETHEUS_AUTH_HEADER }}
      TIJARA_PREFLIGHT_PROMETHEUS_AUTH_VALUE_ENV: ${{ vars.TIJARA_PREFLIGHT_PROMETHEUS_AUTH_VALUE_ENV }}
      TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_HEADER: ${{ vars.TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_HEADER }}
      TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_VALUE_ENV: ${{ vars.TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_VALUE_ENV }}
      TIJARA_PREFLIGHT_GRAFANA_AUTH_HEADER: ${{ vars.TIJARA_PREFLIGHT_GRAFANA_AUTH_HEADER }}
      TIJARA_PREFLIGHT_GRAFANA_AUTH_VALUE_ENV: ${{ vars.TIJARA_PREFLIGHT_GRAFANA_AUTH_VALUE_ENV }}
      TIJARA_ARTIFACT_STORE_REFERENCE: ${{ vars.TIJARA_ARTIFACT_STORE_REFERENCE }}
      TIJARA_ARTIFACT_RETENTION_POLICY_REF: ${{ vars.TIJARA_ARTIFACT_RETENTION_POLICY_REF }}
      TIJARA_CERTIFICATION_RETENTION_POLICY_REF: ${{ vars.TIJARA_CERTIFICATION_RETENTION_POLICY_REF }}
      TIJARA_SECRET_MANAGER_PROVIDER: ${{ vars.TIJARA_SECRET_MANAGER_PROVIDER }}
      TIJARA_SECRET_MANAGER_REFERENCE: ${{ vars.TIJARA_SECRET_MANAGER_REFERENCE }}
      TIJARA_SECRET_ROTATION_POLICY_REF: ${{ vars.TIJARA_SECRET_ROTATION_POLICY_REF }}
      TIJARA_SECRET_ACCESS_REVIEW_REF: ${{ vars.TIJARA_SECRET_ACCESS_REVIEW_REF }}
      TIJARA_RESTORE_DRILL_BACKUP: ${{ vars.TIJARA_RESTORE_DRILL_BACKUP }}
      TIJARA_BACKUP_ARTIFACT_REF: ${{ vars.TIJARA_BACKUP_ARTIFACT_REF }}
      ODOO_IMAGE: ${{ vars.ODOO_IMAGE }}
      POSTGRES_IMAGE: ${{ vars.POSTGRES_IMAGE }}
      TIJARA_BASE_URL: ${{ vars.TIJARA_BASE_URL }}
      ODOO_BASE_URL: ${{ vars.ODOO_BASE_URL }}
      TIJARA_HARDWARE_BRIDGE_URL: ${{ vars.TIJARA_HARDWARE_BRIDGE_URL }}
      TIJARA_PROMETHEUS_URL: ${{ vars.TIJARA_PROMETHEUS_URL }}
      TIJARA_ALERTMANAGER_URL: ${{ vars.TIJARA_ALERTMANAGER_URL }}
      TIJARA_GRAFANA_URL: ${{ vars.TIJARA_GRAFANA_URL }}
      TIJARA_E2E_SCOPE: ${{ vars.TIJARA_E2E_SCOPE }}
      TIJARA_RUN_POS_UI_E2E: ${{ vars.TIJARA_RUN_POS_UI_E2E }}
      TIJARA_RUN_DIRECT_POS_CLICKTHROUGH: ${{ vars.TIJARA_RUN_DIRECT_POS_CLICKTHROUGH }}
      TIJARA_RUN_DIRECT_POS_VALIDATE_E2E: ${{ vars.TIJARA_RUN_DIRECT_POS_VALIDATE_E2E }}
      TIJARA_RUN_DIRECT_REFUND_FORM_E2E: ${{ vars.TIJARA_RUN_DIRECT_REFUND_FORM_E2E }}
      TIJARA_RUN_MOBILE_OFFLINE_E2E: ${{ vars.TIJARA_RUN_MOBILE_OFFLINE_E2E }}
      TIJARA_PROTECTED_E2E_SEED: ${{ vars.TIJARA_PROTECTED_E2E_SEED || '0' }}
      TIJARA_PROTECTED_E2E_PROFILE: ${{ vars.TIJARA_PROTECTED_E2E_PROFILE || '1' }}
      TIJARA_PROTECTED_E2E_RUN_BROWSER: ${{ vars.TIJARA_PROTECTED_E2E_RUN_BROWSER || '1' }}
      TIJARA_PROTECTED_E2E_EXECUTION_EVIDENCE: ${{ vars.TIJARA_PROTECTED_E2E_EXECUTION_EVIDENCE || '1' }}
      TIJARA_PROTECTED_E2E_STRICT: ${{ vars.TIJARA_PROTECTED_E2E_STRICT || '1' }}
      TIJARA_LOAD_VUS: ${{ vars.TIJARA_LOAD_VUS }}
      TIJARA_LOAD_DURATION: ${{ vars.TIJARA_LOAD_DURATION }}
      TIJARA_LOAD_MAX_P95_MS: ${{ vars.TIJARA_LOAD_MAX_P95_MS }}
      TIJARA_LOAD_MAX_FAIL_RATE: ${{ vars.TIJARA_LOAD_MAX_FAIL_RATE }}
      TIJARA_LOAD_MIN_CHECKS_RATE: ${{ vars.TIJARA_LOAD_MIN_CHECKS_RATE }}
      TIJARA_CERT_PSP_PROVIDER: ${{ vars.TIJARA_CERT_PSP_PROVIDER }}
      TIJARA_CERT_PSP_REFERENCE: ${{ vars.TIJARA_CERT_PSP_REFERENCE }}
      TIJARA_CERT_PSP_OWNER: ${{ vars.TIJARA_CERT_PSP_OWNER }}
      TIJARA_CERT_PSP_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_PSP_EVIDENCE_FILES }}
      TIJARA_CERT_PSP_ARTIFACT_MANIFEST: ${{ vars.TIJARA_CERT_PSP_ARTIFACT_MANIFEST }}
      TIJARA_CERT_PSP_EXPECTED_SHA256: ${{ vars.TIJARA_CERT_PSP_EXPECTED_SHA256 }}
      TIJARA_CERT_PSP_MINIMUM_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_PSP_MINIMUM_EVIDENCE_FILES }}
      TIJARA_CERT_PSP_APPROVED_BY: ${{ vars.TIJARA_CERT_PSP_APPROVED_BY }}
      TIJARA_CERT_PSP_APPROVAL_REFERENCE: ${{ vars.TIJARA_CERT_PSP_APPROVAL_REFERENCE }}
      TIJARA_CERT_PSP_VALID_UNTIL: ${{ vars.TIJARA_CERT_PSP_VALID_UNTIL }}
      TIJARA_CERT_PSP_METADATA: ${{ vars.TIJARA_CERT_PSP_METADATA }}
      TIJARA_CERT_FBR_PROVIDER: ${{ vars.TIJARA_CERT_FBR_PROVIDER }}
      TIJARA_CERT_FBR_REFERENCE: ${{ vars.TIJARA_CERT_FBR_REFERENCE }}
      TIJARA_CERT_FBR_OWNER: ${{ vars.TIJARA_CERT_FBR_OWNER }}
      TIJARA_CERT_FBR_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_FBR_EVIDENCE_FILES }}
      TIJARA_CERT_FBR_ARTIFACT_MANIFEST: ${{ vars.TIJARA_CERT_FBR_ARTIFACT_MANIFEST }}
      TIJARA_CERT_FBR_EXPECTED_SHA256: ${{ vars.TIJARA_CERT_FBR_EXPECTED_SHA256 }}
      TIJARA_CERT_FBR_MINIMUM_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_FBR_MINIMUM_EVIDENCE_FILES }}
      TIJARA_CERT_FBR_APPROVED_BY: ${{ vars.TIJARA_CERT_FBR_APPROVED_BY }}
      TIJARA_CERT_FBR_APPROVAL_REFERENCE: ${{ vars.TIJARA_CERT_FBR_APPROVAL_REFERENCE }}
      TIJARA_CERT_FBR_VALID_UNTIL: ${{ vars.TIJARA_CERT_FBR_VALID_UNTIL }}
      TIJARA_CERT_FBR_METADATA: ${{ vars.TIJARA_CERT_FBR_METADATA }}
      TIJARA_CERT_HARDWARE_OWNER: ${{ vars.TIJARA_CERT_HARDWARE_OWNER }}
      TIJARA_CERT_HARDWARE_STORE: ${{ vars.TIJARA_CERT_HARDWARE_STORE }}
      TIJARA_CERT_HARDWARE_DEVICE_MODEL: ${{ vars.TIJARA_CERT_HARDWARE_DEVICE_MODEL }}
      TIJARA_CERT_HARDWARE_DEVICE_SERIAL: ${{ vars.TIJARA_CERT_HARDWARE_DEVICE_SERIAL }}
      TIJARA_CERT_HARDWARE_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_HARDWARE_EVIDENCE_FILES }}
      TIJARA_CERT_HARDWARE_ARTIFACT_MANIFEST: ${{ vars.TIJARA_CERT_HARDWARE_ARTIFACT_MANIFEST }}
      TIJARA_CERT_HARDWARE_EXPECTED_SHA256: ${{ vars.TIJARA_CERT_HARDWARE_EXPECTED_SHA256 }}
      TIJARA_CERT_HARDWARE_MINIMUM_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_HARDWARE_MINIMUM_EVIDENCE_FILES }}
      TIJARA_CERT_HARDWARE_APPROVED_BY: ${{ vars.TIJARA_CERT_HARDWARE_APPROVED_BY }}
      TIJARA_CERT_HARDWARE_APPROVAL_REFERENCE: ${{ vars.TIJARA_CERT_HARDWARE_APPROVAL_REFERENCE }}
      TIJARA_CERT_HARDWARE_VALID_UNTIL: ${{ vars.TIJARA_CERT_HARDWARE_VALID_UNTIL }}
      TIJARA_CERT_HARDWARE_METADATA: ${{ vars.TIJARA_CERT_HARDWARE_METADATA }}
      ODOO_DATABASE: ${{ secrets.ODOO_DATABASE }}
      ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
      ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
      TIJARA_E2E_LOGIN: ${{ secrets.TIJARA_E2E_LOGIN }}
      TIJARA_E2E_PASSWORD: ${{ secrets.TIJARA_E2E_PASSWORD }}
      TIJARA_BRIDGE_SHARED_SECRET: ${{ secrets.TIJARA_BRIDGE_SHARED_SECRET }}
      TIJARA_PREFLIGHT_ODOO_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_ODOO_AUTH_VALUE }}
      TIJARA_PREFLIGHT_PROMETHEUS_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_PROMETHEUS_AUTH_VALUE }}
      TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_VALUE }}
      TIJARA_PREFLIGHT_GRAFANA_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_GRAFANA_AUTH_VALUE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve protected run ID
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="${{ inputs.target_environment }}-${GITHUB_RUN_ID}"
          fi
          echo "TIJARA_PROTECTED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Protected operator handoff runbook
        continue-on-error: true
        run: |
          python3 scripts/export_protected_runbook_handoff.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-runbook-handoff/$TIJARA_PROTECTED_RUN_ID" \
            --strict
      - name: Protected first run checklist
        continue-on-error: true
        run: |
          python3 scripts/export_protected_first_run_checklist.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-first-run/$TIJARA_PROTECTED_RUN_ID" \
            --strict
      - name: Protected runner preflight evidence
        continue-on-error: true
        run: |
          PREFLIGHT_ARGS=()
          if [[ "${TIJARA_PREFLIGHT_PROBE_URLS:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--probe-urls)
          fi
          if [[ "${TIJARA_PREFLIGHT_REQUIRE_URLS:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--require-url-probes)
          fi
          if [[ "${TIJARA_PREFLIGHT_AUTH_PROBES:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--auth-probes)
          fi
          if [[ "${TIJARA_PREFLIGHT_REQUIRE_AUTH:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--require-auth-probes)
          fi
          python3 scripts/export_protected_runner_preflight.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-runner-preflight/$TIJARA_PROTECTED_RUN_ID" \
            "${PREFLIGHT_ARGS[@]}" \
            --strict
      - name: Protected release candidate gate
        run: |
          TIJARA_RELEASE_RUN_ID="$TIJARA_PROTECTED_RUN_ID" \
          TIJARA_RELEASE_CHECKS="$TIJARA_PROTECTED_RELEASE_CHECKS" \
          make release-candidate
      - name: Protected Browser E2E evidence
        continue-on-error: true
        run: make protected-browser-e2e
      - name: Capture protected operations tool outputs
        shell: bash
        run: |
          set -euo pipefail
          RAW_DIR="deploy/runtime/ops-tool-raw/$TIJARA_PROTECTED_RUN_ID"
          mkdir -p "$RAW_DIR"
          echo "TIJARA_OPS_TOOL_RAW_DIR=$RAW_DIR" >> "$GITHUB_ENV"

          set +e
          if [[ -n "${TIJARA_RESTORE_DRILL_BACKUP:-}" ]]; then
            CONFIRM_RESTORE_DRILL=YES bash deploy/postgres/restore-drill.sh "$TIJARA_RESTORE_DRILL_BACKUP" > "$RAW_DIR/restore-drill.log" 2>&1
            RESTORE_EXIT=$?
          else
            echo "TIJARA_RESTORE_DRILL_BACKUP is not configured." > "$RAW_DIR/restore-drill.log"
            RESTORE_EXIT=2
          fi

          bash scripts/security_audit.sh > "$RAW_DIR/security-audit.log" 2>&1
          SECURITY_EXIT=$?

          bash scripts/dependency_scan.sh > "$RAW_DIR/dependency-scan.log" 2>&1
          DEPENDENCY_EXIT=$?

          npm audit --json > "$RAW_DIR/npm-audit.json" 2> "$RAW_DIR/npm-audit.stderr"
          NPM_AUDIT_EXIT=$?

          bash scripts/container_scan.sh > "$RAW_DIR/container-scan.log" 2>&1
          CONTAINER_EXIT=$?

          if command -v k6 >/dev/null 2>&1; then
            k6 run --summary-export "$RAW_DIR/k6-summary.json" scripts/load_smoke.k6.js > "$RAW_DIR/k6.log" 2>&1
            K6_EXIT=$?
          else
            echo "k6 is not installed on the protected runner." > "$RAW_DIR/k6.log"
            K6_EXIT=127
          fi
          set -e

          echo "TIJARA_RESTORE_EXIT=$RESTORE_EXIT" >> "$GITHUB_ENV"
          echo "TIJARA_SECURITY_EXIT=$SECURITY_EXIT" >> "$GITHUB_ENV"
          echo "TIJARA_DEPENDENCY_EXIT=$DEPENDENCY_EXIT" >> "$GITHUB_ENV"
          echo "TIJARA_NPM_AUDIT_EXIT=$NPM_AUDIT_EXIT" >> "$GITHUB_ENV"
          echo "TIJARA_CONTAINER_EXIT=$CONTAINER_EXIT" >> "$GITHUB_ENV"
          echo "TIJARA_K6_EXIT=$K6_EXIT" >> "$GITHUB_ENV"
      - name: Export protected operations tool evidence
        continue-on-error: true
        run: |
          python3 scripts/export_ops_tool_evidence.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/ops-tool-evidence/$TIJARA_PROTECTED_RUN_ID" \
