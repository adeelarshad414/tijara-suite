      TIJARA_DEPLOYMENT_GATE_REF: ${{ vars.TIJARA_DEPLOYMENT_GATE_REF || 'workflow:tijara-ci/protected-release-evidence' }}
      TIJARA_ENV_INCIDENT_RUNBOOK_REF: ${{ vars.TIJARA_ENV_INCIDENT_RUNBOOK_REF || vars.TIJARA_INCIDENT_RUNBOOK_URL }}
      TIJARA_ENV_BACKUP_POLICY_REF: ${{ vars.TIJARA_ENV_BACKUP_POLICY_REF || vars.TIJARA_ARTIFACT_RETENTION_POLICY_REF }}
      TIJARA_ENV_MONITORING_REF: ${{ vars.TIJARA_ENV_MONITORING_REF || vars.TIJARA_GRAFANA_URL }}
      TIJARA_CHANGE_TICKET_REF: ${{ vars.TIJARA_CHANGE_TICKET_REF || vars.TIJARA_FIRST_RUN_CHANGE_TICKET_REF }}
      TIJARA_FREEZE_WINDOW_REF: ${{ vars.TIJARA_FREEZE_WINDOW_REF }}
      TIJARA_SECRET_RUNTIME_PROBES: ${{ vars.TIJARA_SECRET_RUNTIME_PROBES || 'odoo_password=env:ODOO_PASSWORD,e2e_password=env:TIJARA_E2E_PASSWORD,bridge_secret=env:TIJARA_BRIDGE_SHARED_SECRET' }}
      TIJARA_SECRET_RUNTIME_EXPECTED_SECRETS: ${{ vars.TIJARA_SECRET_RUNTIME_EXPECTED_SECRETS || 'odoo_password,e2e_password' }}
      TIJARA_SECRET_RUNTIME_MINIMUM_PROBES: ${{ vars.TIJARA_SECRET_RUNTIME_MINIMUM_PROBES || '2' }}
      TIJARA_SECRET_RUNTIME_TIMEOUT: ${{ vars.TIJARA_SECRET_RUNTIME_TIMEOUT || '8' }}
      TIJARA_SECRET_RUNTIME_ALLOW_PLACEHOLDER: ${{ vars.TIJARA_SECRET_RUNTIME_ALLOW_PLACEHOLDER || '0' }}
      TIJARA_TENANT_OPS_ARTIFACTS: ${{ vars.TIJARA_TENANT_OPS_ARTIFACTS }}
      TIJARA_TENANT_OPS_MINIMUM_TENANTS: ${{ vars.TIJARA_TENANT_OPS_MINIMUM_TENANTS || '1' }}
      TIJARA_TENANT_OPS_REQUIRE_DNS_PROVIDER: ${{ vars.TIJARA_TENANT_OPS_REQUIRE_DNS_PROVIDER || '1' }}
      TIJARA_TENANT_OPS_REQUIRE_ADMIN_EMAIL: ${{ vars.TIJARA_TENANT_OPS_REQUIRE_ADMIN_EMAIL || '1' }}
      TIJARA_TENANT_OPS_REQUIRE_RESTORE_DRILL: ${{ vars.TIJARA_TENANT_OPS_REQUIRE_RESTORE_DRILL || '1' }}
      TIJARA_TENANT_OPS_REQUIRE_MONITORING: ${{ vars.TIJARA_TENANT_OPS_REQUIRE_MONITORING || '1' }}
      TIJARA_TENANT_OPS_REQUIRE_ALL_ARTIFACTS: ${{ vars.TIJARA_TENANT_OPS_REQUIRE_ALL_ARTIFACTS || '1' }}
      TIJARA_MONITORING_TIMEOUT: ${{ vars.TIJARA_MONITORING_TIMEOUT || '8' }}
      TIJARA_MONITORING_NON_STRICT: ${{ vars.TIJARA_MONITORING_NON_STRICT || '1' }}
      TIJARA_DRILL_TIMEOUT: ${{ vars.TIJARA_DRILL_TIMEOUT || '8' }}
      TIJARA_OPS_BUNDLE_CHECKS: ${{ vars.TIJARA_OPS_BUNDLE_CHECKS || 'load-matrix,load-enterprise,smoke,monitoring,incident,retention' }}
      TIJARA_OPS_BUNDLE_STRICT: ${{ vars.TIJARA_OPS_BUNDLE_STRICT || '0' }}
      TIJARA_OPS_BUNDLE_FAIL_ON_WARNING: ${{ vars.TIJARA_OPS_BUNDLE_FAIL_ON_WARNING || '0' }}
      TIJARA_PROD_OPS_ALLOW_WARNING_EXCEPTION: ${{ vars.TIJARA_PROD_OPS_ALLOW_WARNING_EXCEPTION || '0' }}
      TIJARA_PROD_OPS_WARNING_EXCEPTION_REF: ${{ vars.TIJARA_PROD_OPS_WARNING_EXCEPTION_REF }}
      TIJARA_PROD_OPS_WARNING_EXCEPTION_APPROVED_BY: ${{ vars.TIJARA_PROD_OPS_WARNING_EXCEPTION_APPROVED_BY }}
      TIJARA_PROD_OPS_WARNING_EXCEPTION_REASON: ${{ vars.TIJARA_PROD_OPS_WARNING_EXCEPTION_REASON }}
      TIJARA_PROD_OPS_WARNING_EXCEPTION_EXPIRES_AT: ${{ vars.TIJARA_PROD_OPS_WARNING_EXCEPTION_EXPIRES_AT }}
      TIJARA_PROD_OPS_WARNING_EXCEPTION_AUDIT_REF: ${{ vars.TIJARA_PROD_OPS_WARNING_EXCEPTION_AUDIT_REF }}
      TIJARA_RESTORE_DRILL_BACKUP: ${{ vars.TIJARA_RESTORE_DRILL_BACKUP }}
      TIJARA_BACKUP_ARTIFACT_REF: ${{ vars.TIJARA_BACKUP_ARTIFACT_REF }}
      ODOO_IMAGE: ${{ vars.ODOO_IMAGE }}
      POSTGRES_IMAGE: ${{ vars.POSTGRES_IMAGE }}
      TIJARA_BASE_URL: ${{ vars.TIJARA_BASE_URL }}
      ODOO_BASE_URL: ${{ vars.ODOO_BASE_URL }}
      TIJARA_HARDWARE_BRIDGE_URL: ${{ vars.TIJARA_HARDWARE_BRIDGE_URL }}
      TIJARA_PROMETHEUS_URL: ${{ vars.TIJARA_PROMETHEUS_URL }}
      TIJARA_ALERTMANAGER_URL: ${{ vars.TIJARA_ALERTMANAGER_URL }}
      TIJARA_GRAFANA_URL: ${{ vars.TIJARA_GRAFANA_URL }}
      TIJARA_E2E_SCOPE: ${{ vars.TIJARA_E2E_SCOPE }}
      TIJARA_RUN_POS_UI_E2E: ${{ vars.TIJARA_RUN_POS_UI_E2E }}
      TIJARA_RUN_DIRECT_POS_CLICKTHROUGH: ${{ vars.TIJARA_RUN_DIRECT_POS_CLICKTHROUGH }}
      TIJARA_RUN_DIRECT_POS_VALIDATE_E2E: ${{ vars.TIJARA_RUN_DIRECT_POS_VALIDATE_E2E }}
      TIJARA_RUN_DIRECT_REFUND_FORM_E2E: ${{ vars.TIJARA_RUN_DIRECT_REFUND_FORM_E2E }}
      TIJARA_RUN_MOBILE_OFFLINE_E2E: ${{ vars.TIJARA_RUN_MOBILE_OFFLINE_E2E }}
      TIJARA_PROTECTED_E2E_SEED: ${{ vars.TIJARA_PROTECTED_E2E_SEED || '0' }}
      TIJARA_PROTECTED_E2E_PROFILE: ${{ vars.TIJARA_PROTECTED_E2E_PROFILE || '1' }}
      TIJARA_PROTECTED_E2E_RUN_BROWSER: ${{ vars.TIJARA_PROTECTED_E2E_RUN_BROWSER || '1' }}
      TIJARA_PROTECTED_E2E_EXECUTION_EVIDENCE: ${{ vars.TIJARA_PROTECTED_E2E_EXECUTION_EVIDENCE || '1' }}
      TIJARA_PROTECTED_E2E_STRICT: ${{ vars.TIJARA_PROTECTED_E2E_STRICT || '1' }}
      TIJARA_LOAD_VUS: ${{ vars.TIJARA_LOAD_VUS }}
      TIJARA_LOAD_DURATION: ${{ vars.TIJARA_LOAD_DURATION }}
      TIJARA_LOAD_MAX_P95_MS: ${{ vars.TIJARA_LOAD_MAX_P95_MS }}
      TIJARA_LOAD_MAX_FAIL_RATE: ${{ vars.TIJARA_LOAD_MAX_FAIL_RATE }}
      TIJARA_LOAD_MIN_CHECKS_RATE: ${{ vars.TIJARA_LOAD_MIN_CHECKS_RATE }}
      TIJARA_CERT_PSP_PROVIDER: ${{ vars.TIJARA_CERT_PSP_PROVIDER }}
      TIJARA_CERT_PSP_REFERENCE: ${{ vars.TIJARA_CERT_PSP_REFERENCE }}
      TIJARA_CERT_PSP_OWNER: ${{ vars.TIJARA_CERT_PSP_OWNER }}
      TIJARA_CERT_PSP_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_PSP_EVIDENCE_FILES }}
      TIJARA_CERT_PSP_ARTIFACT_MANIFEST: ${{ vars.TIJARA_CERT_PSP_ARTIFACT_MANIFEST }}
      TIJARA_CERT_PSP_EXPECTED_SHA256: ${{ vars.TIJARA_CERT_PSP_EXPECTED_SHA256 }}
      TIJARA_CERT_PSP_MINIMUM_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_PSP_MINIMUM_EVIDENCE_FILES }}
      TIJARA_CERT_PSP_APPROVED_BY: ${{ vars.TIJARA_CERT_PSP_APPROVED_BY }}
      TIJARA_CERT_PSP_APPROVAL_REFERENCE: ${{ vars.TIJARA_CERT_PSP_APPROVAL_REFERENCE }}
      TIJARA_CERT_PSP_VALID_UNTIL: ${{ vars.TIJARA_CERT_PSP_VALID_UNTIL }}
      TIJARA_CERT_PSP_METADATA: ${{ vars.TIJARA_CERT_PSP_METADATA }}
      TIJARA_CERT_FBR_PROVIDER: ${{ vars.TIJARA_CERT_FBR_PROVIDER }}
      TIJARA_CERT_FBR_REFERENCE: ${{ vars.TIJARA_CERT_FBR_REFERENCE }}
      TIJARA_CERT_FBR_OWNER: ${{ vars.TIJARA_CERT_FBR_OWNER }}
      TIJARA_CERT_FBR_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_FBR_EVIDENCE_FILES }}
      TIJARA_CERT_FBR_ARTIFACT_MANIFEST: ${{ vars.TIJARA_CERT_FBR_ARTIFACT_MANIFEST }}
      TIJARA_CERT_FBR_EXPECTED_SHA256: ${{ vars.TIJARA_CERT_FBR_EXPECTED_SHA256 }}
      TIJARA_CERT_FBR_MINIMUM_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_FBR_MINIMUM_EVIDENCE_FILES }}
      TIJARA_CERT_FBR_APPROVED_BY: ${{ vars.TIJARA_CERT_FBR_APPROVED_BY }}
      TIJARA_CERT_FBR_APPROVAL_REFERENCE: ${{ vars.TIJARA_CERT_FBR_APPROVAL_REFERENCE }}
      TIJARA_CERT_FBR_VALID_UNTIL: ${{ vars.TIJARA_CERT_FBR_VALID_UNTIL }}
      TIJARA_CERT_FBR_METADATA: ${{ vars.TIJARA_CERT_FBR_METADATA }}
      TIJARA_CERT_HARDWARE_OWNER: ${{ vars.TIJARA_CERT_HARDWARE_OWNER }}
      TIJARA_CERT_HARDWARE_STORE: ${{ vars.TIJARA_CERT_HARDWARE_STORE }}
      TIJARA_CERT_HARDWARE_DEVICE_MODEL: ${{ vars.TIJARA_CERT_HARDWARE_DEVICE_MODEL }}
      TIJARA_CERT_HARDWARE_DEVICE_SERIAL: ${{ vars.TIJARA_CERT_HARDWARE_DEVICE_SERIAL }}
      TIJARA_CERT_HARDWARE_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_HARDWARE_EVIDENCE_FILES }}
      TIJARA_CERT_HARDWARE_ARTIFACT_MANIFEST: ${{ vars.TIJARA_CERT_HARDWARE_ARTIFACT_MANIFEST }}
      TIJARA_CERT_HARDWARE_EXPECTED_SHA256: ${{ vars.TIJARA_CERT_HARDWARE_EXPECTED_SHA256 }}
      TIJARA_CERT_HARDWARE_MINIMUM_EVIDENCE_FILES: ${{ vars.TIJARA_CERT_HARDWARE_MINIMUM_EVIDENCE_FILES }}
      TIJARA_CERT_HARDWARE_APPROVED_BY: ${{ vars.TIJARA_CERT_HARDWARE_APPROVED_BY }}
      TIJARA_CERT_HARDWARE_APPROVAL_REFERENCE: ${{ vars.TIJARA_CERT_HARDWARE_APPROVAL_REFERENCE }}
      TIJARA_CERT_HARDWARE_VALID_UNTIL: ${{ vars.TIJARA_CERT_HARDWARE_VALID_UNTIL }}
      TIJARA_CERT_HARDWARE_METADATA: ${{ vars.TIJARA_CERT_HARDWARE_METADATA }}
      ODOO_DATABASE: ${{ secrets.ODOO_DATABASE }}
      ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
      ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
      TIJARA_E2E_LOGIN: ${{ secrets.TIJARA_E2E_LOGIN }}
      TIJARA_E2E_PASSWORD: ${{ secrets.TIJARA_E2E_PASSWORD }}
      TIJARA_BRIDGE_SHARED_SECRET: ${{ secrets.TIJARA_BRIDGE_SHARED_SECRET }}
      TIJARA_PREFLIGHT_ODOO_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_ODOO_AUTH_VALUE }}
      TIJARA_PREFLIGHT_PROMETHEUS_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_PROMETHEUS_AUTH_VALUE }}
      TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_ALERTMANAGER_AUTH_VALUE }}
      TIJARA_PREFLIGHT_GRAFANA_AUTH_VALUE: ${{ secrets.TIJARA_PREFLIGHT_GRAFANA_AUTH_VALUE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve protected run ID
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="${{ inputs.target_environment }}-${GITHUB_RUN_ID}"
          fi
          echo "TIJARA_PROTECTED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Protected operator handoff runbook
        continue-on-error: true
        run: |
          python3 scripts/export_protected_runbook_handoff.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-runbook-handoff/$TIJARA_PROTECTED_RUN_ID" \
            --strict
      - name: Protected first run checklist
        continue-on-error: true
        run: |
          python3 scripts/export_protected_first_run_checklist.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-first-run/$TIJARA_PROTECTED_RUN_ID" \
            --strict
      - name: Protected runner preflight evidence
        continue-on-error: true
        run: |
          PREFLIGHT_ARGS=()
          if [[ "${TIJARA_PREFLIGHT_PROBE_URLS:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--probe-urls)
          fi
          if [[ "${TIJARA_PREFLIGHT_REQUIRE_URLS:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--require-url-probes)
          fi
          if [[ "${TIJARA_PREFLIGHT_AUTH_PROBES:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--auth-probes)
          fi
          if [[ "${TIJARA_PREFLIGHT_REQUIRE_AUTH:-0}" == "1" ]]; then
            PREFLIGHT_ARGS+=(--require-auth-probes)
          fi
          python3 scripts/export_protected_runner_preflight.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-runner-preflight/$TIJARA_PROTECTED_RUN_ID" \
            "${PREFLIGHT_ARGS[@]}" \
            --strict
      - name: Protected runner bootstrap verification
        continue-on-error: true
        run: |
          BOOTSTRAP_VERIFY_ARGS=()
          if [[ -n "${TIJARA_BOOTSTRAP_VERIFICATION_BOOTSTRAP_EVIDENCE:-}" ]]; then
            BOOTSTRAP_VERIFY_ARGS+=(--bootstrap-evidence "$TIJARA_BOOTSTRAP_VERIFICATION_BOOTSTRAP_EVIDENCE")
          fi
          if [[ "${TIJARA_BOOTSTRAP_VERIFICATION_STRICT:-0}" == "1" ]]; then
            BOOTSTRAP_VERIFY_ARGS+=(--strict)
          fi
          python3 scripts/export_protected_runner_bootstrap_verification.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-runner-bootstrap-verification/$TIJARA_PROTECTED_RUN_ID" \
            --preflight-evidence "deploy/runtime/protected-runner-preflight/$TIJARA_PROTECTED_RUN_ID/protected-runner-preflight.json" \
            --required-tools "$TIJARA_BOOTSTRAP_VERIFICATION_REQUIRED_TOOLS" \
            "${BOOTSTRAP_VERIFY_ARGS[@]}"
      - name: Protected authenticated service checks
        continue-on-error: true
        run: |
          SERVICE_ARGS=()
          if [[ "${TIJARA_SERVICE_CHECKS_PROBE:-0}" == "1" ]]; then
            SERVICE_ARGS+=(--probe)
          fi
          if [[ "${TIJARA_SERVICE_CHECKS_REQUIRE_PROBES:-0}" == "1" ]]; then
            SERVICE_ARGS+=(--require-probes)
          fi
          python3 scripts/export_protected_service_checks.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-service-checks/$TIJARA_PROTECTED_RUN_ID" \
            --timeout "$TIJARA_SERVICE_CHECKS_TIMEOUT" \
            "${SERVICE_ARGS[@]}" \
            --strict
      - name: Protected PSP/FBR provider readiness
        continue-on-error: true
        run: |
          PROVIDER_ARGS=()
          if [[ "${TIJARA_PROVIDER_READINESS_REQUIRE_PSP:-0}" == "1" ]]; then
            PROVIDER_ARGS+=(--require-psp)
          fi
          if [[ "${TIJARA_PROVIDER_READINESS_REQUIRE_FBR:-0}" == "1" ]]; then
            PROVIDER_ARGS+=(--require-fbr)
          fi
          if [[ "${TIJARA_PROVIDER_READINESS_REQUIRE_LIVE_FBR:-0}" == "1" ]]; then
            PROVIDER_ARGS+=(--require-live-fbr)
          fi
          if [[ "${TIJARA_PROVIDER_READINESS_FAIL_ON_WARNING:-0}" == "1" ]]; then
            PROVIDER_ARGS+=(--fail-on-warning)
          fi
          python3 scripts/export_protected_provider_readiness.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-provider-readiness/$TIJARA_PROTECTED_RUN_ID" \
            "${PROVIDER_ARGS[@]}" \
            --strict
      - name: Protected payment lifecycle evidence
        continue-on-error: true
        run: |
          PAYMENT_ARGS=()
          if [[ "${TIJARA_PAYMENT_LIFECYCLE_REQUIRE_NATIVE_SIGNATURES:-0}" == "1" ]]; then
            PAYMENT_ARGS+=(--require-native-signatures)
          fi
          if [[ "${TIJARA_PAYMENT_LIFECYCLE_REQUIRE_PROVIDER_CERTIFICATION:-0}" == "1" ]]; then
            PAYMENT_ARGS+=(--require-provider-certification)
          fi
          if [[ "${TIJARA_PAYMENT_LIFECYCLE_FAIL_ON_WARNING:-0}" == "1" ]]; then
            PAYMENT_ARGS+=(--fail-on-warning)
          fi
          python3 scripts/export_protected_payment_lifecycle_evidence.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-payment-lifecycle/$TIJARA_PROTECTED_RUN_ID" \
            "${PAYMENT_ARGS[@]}" \
            --strict
      - name: Protected release candidate gate
        run: |
          TIJARA_RELEASE_RUN_ID="$TIJARA_PROTECTED_RUN_ID" \
          TIJARA_RELEASE_CHECKS="$TIJARA_PROTECTED_RELEASE_CHECKS" \
          make release-candidate
      - name: Protected Browser E2E evidence
        continue-on-error: true
        run: make protected-browser-e2e
      - name: Protected offline replay evidence
        continue-on-error: true
        run: |
          OFFLINE_REPLAY_ARGS=()
          if [[ "${TIJARA_OFFLINE_REPLAY_REQUIRE_E2E:-0}" == "1" ]]; then
            OFFLINE_REPLAY_ARGS+=(--require-e2e)
          fi
          if [[ "${TIJARA_OFFLINE_REPLAY_REQUIRE_PLAYWRIGHT_PASS:-0}" == "1" ]]; then
            OFFLINE_REPLAY_ARGS+=(--require-playwright-pass)
          fi
          if [[ "${TIJARA_OFFLINE_REPLAY_REQUIRE_DUPLICATE_PROOF:-0}" == "1" ]]; then
            OFFLINE_REPLAY_ARGS+=(--require-duplicate-proof)
          fi
          if [[ "${TIJARA_OFFLINE_REPLAY_FAIL_ON_WARNING:-0}" == "1" ]]; then
            OFFLINE_REPLAY_ARGS+=(--fail-on-warning)
          fi
          python3 scripts/export_protected_offline_replay_evidence.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-offline-replay/$TIJARA_PROTECTED_RUN_ID" \
            "${OFFLINE_REPLAY_ARGS[@]}" \
            --strict
      - name: Protected offline queue snapshot
        continue-on-error: true
        run: |
          OFFLINE_SNAPSHOT_ARGS=()
          if [[ "${TIJARA_OFFLINE_QUEUE_SNAPSHOT_PROBE:-0}" == "1" ]]; then
            OFFLINE_SNAPSHOT_ARGS+=(--probe)
          fi
          if [[ "${TIJARA_OFFLINE_QUEUE_SNAPSHOT_REQUIRE_PROBE:-0}" == "1" ]]; then
            OFFLINE_SNAPSHOT_ARGS+=(--require-probe)
          fi
          if [[ "${TIJARA_OFFLINE_QUEUE_SNAPSHOT_FAIL_ON_WARNING:-0}" == "1" ]]; then
            OFFLINE_SNAPSHOT_ARGS+=(--fail-on-warning)
          fi
          python3 scripts/export_protected_offline_queue_snapshot.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-offline-pilot/$TIJARA_PROTECTED_RUN_ID/queue-snapshot" \
            "${OFFLINE_SNAPSHOT_ARGS[@]}" \
            --strict
      - name: Protected offline POS pilot evidence
        continue-on-error: true
        run: |
          OFFLINE_PILOT_ARGS=()
          if [[ "${TIJARA_OFFLINE_PILOT_REQUIRE_REPLAY_PASS:-0}" == "1" ]]; then
            OFFLINE_PILOT_ARGS+=(--require-offline-replay-pass)
          fi
          if [[ "${TIJARA_OFFLINE_PILOT_REQUIRE_RUNTIME_PROOF:-0}" == "1" ]]; then
            OFFLINE_PILOT_ARGS+=(--require-runtime-proof)
          fi
          if [[ "${TIJARA_OFFLINE_PILOT_REQUIRE_DUPLICATE_PROOF:-0}" == "1" ]]; then
            OFFLINE_PILOT_ARGS+=(--require-duplicate-proof)
          fi
          if [[ "${TIJARA_OFFLINE_PILOT_FAIL_ON_WARNING:-0}" == "1" ]]; then
            OFFLINE_PILOT_ARGS+=(--fail-on-warning)
          fi
          python3 scripts/export_protected_offline_pilot_evidence.py \
            --run-id "$TIJARA_PROTECTED_RUN_ID" \
            --target-environment "$TIJARA_TARGET_ENVIRONMENT" \
            --output "deploy/runtime/protected-offline-pilot/$TIJARA_PROTECTED_RUN_ID" \
            --offline-replay-evidence "deploy/runtime/protected-offline-replay/$TIJARA_PROTECTED_RUN_ID/protected-offline-replay-evidence.json" \
            --queue-status-json "deploy/runtime/protected-offline-pilot/$TIJARA_PROTECTED_RUN_ID/queue-snapshot/offline-queue-snapshot.json" \
            "${OFFLINE_PILOT_ARGS[@]}" \
            --strict
      - name: Capture protected operations tool outputs
        shell: bash
        run: |
          set -euo pipefail
          RAW_DIR="deploy/runtime/ops-tool-raw/$TIJARA_PROTECTED_RUN_ID"
          mkdir -p "$RAW_DIR"
          echo "TIJARA_OPS_TOOL_RAW_DIR=$RAW_DIR" >> "$GITHUB_ENV"

          set +e
          if [[ -n "${TIJARA_RESTORE_DRILL_BACKUP:-}" ]]; then
            CONFIRM_RESTORE_DRILL=YES bash deploy/postgres/restore-drill.sh "$TIJARA_RESTORE_DRILL_BACKUP" > "$RAW_DIR/restore-drill.log" 2>&1
            RESTORE_EXIT=$?
          else
            echo "TIJARA_RESTORE_DRILL_BACKUP is not configured." > "$RAW_DIR/restore-drill.log"
            RESTORE_EXIT=2
          fi

          bash scripts/security_audit.sh > "$RAW_DIR/security-audit.log" 2>&1
          SECURITY_EXIT=$?

          bash scripts/dependency_scan.sh > "$RAW_DIR/dependency-scan.log" 2>&1
          DEPENDENCY_EXIT=$?

          npm audit --json > "$RAW_DIR/npm-audit.json" 2> "$RAW_DIR/npm-audit.stderr"
          NPM_AUDIT_EXIT=$?

          if command -v pip-audit >/dev/null 2>&1; then
            pip-audit --format json > "$RAW_DIR/pip-audit.json" 2> "$RAW_DIR/pip-audit.stderr"
            PIP_AUDIT_EXIT=$?
          else
            echo "pip-audit is not installed on the protected runner." > "$RAW_DIR/pip-audit.stderr"
            PIP_AUDIT_EXIT=127
          fi

          bash scripts/container_scan.sh > "$RAW_DIR/container-scan.log" 2>&1
          CONTAINER_EXIT=$?

          if command -v trivy >/dev/null 2>&1; then
            trivy config --format json --severity HIGH,CRITICAL . > "$RAW_DIR/trivy-config.json" 2> "$RAW_DIR/trivy-config.stderr"
            TRIVY_CONFIG_EXIT=$?
            trivy image --format json --severity HIGH,CRITICAL "${ODOO_IMAGE:-odoo:19.0}" > "$RAW_DIR/trivy-odoo.json" 2> "$RAW_DIR/trivy-odoo.stderr"
            TRIVY_ODOO_EXIT=$?
            trivy image --format json --severity HIGH,CRITICAL "${POSTGRES_IMAGE:-postgres:16-alpine}" > "$RAW_DIR/trivy-postgres.json" 2> "$RAW_DIR/trivy-postgres.stderr"
            TRIVY_POSTGRES_EXIT=$?
          else
            echo "trivy is not installed on the protected runner." > "$RAW_DIR/trivy.stderr"
            TRIVY_CONFIG_EXIT=127
            TRIVY_ODOO_EXIT=127
            TRIVY_POSTGRES_EXIT=127
          fi

          if command -v k6 >/dev/null 2>&1; then
