name: Tijara CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate scaffold
        run: bash scripts/validate_scaffold.sh
      - name: Check JavaScript syntax
        run: bash scripts/js_check.sh
      - name: Security audit baseline
        run: bash scripts/security_audit.sh
      - name: Validate compose config
        run: docker compose --env-file .env.example --env-file secrets/.env.secrets.example config --quiet
      - name: Local release candidate gate
        run: TIJARA_RELEASE_RUN_ID=ci-local TIJARA_RELEASE_CHECKS=local make release-candidate
      - name: Local release retention evidence
        run: |
          python3 scripts/export_release_retention_evidence.py \
            --run-id ci-local \
            --target-environment ci \
            --output deploy/runtime/release-retention-evidence/ci-local \
            --artifact-store-reference github-actions:tijara-ci-release-evidence \
            --artifact-retention-policy-ref github-actions:retention-days-30 \
            --certification-retention-policy-ref docs:DEPLOY.md#external-certification-evidence-intake \
            --secret-manager-provider github-actions-secrets \
            --secret-manager-reference github-actions:tijara-ci \
            --secret-rotation-policy-ref docs:DEPLOY.md#secret-handling \
            --ci-artifact-retention-days 30 \
            --release-evidence-retention-days 365 \
            --certification-evidence-retention-days 365 \
            --log-retention-days 30 \
            --backup-retention-days 30 \
            --evidence-path deploy/runtime/release-evidence/ci-local \
            --strict
      - name: Local secret manager evidence
        run: |
          python3 scripts/export_secret_manager_evidence.py \
            --run-id ci-local \
            --target-environment ci \
            --output deploy/runtime/secret-manager-evidence/ci-local \
            --secret-manager-provider github-actions-secrets \
            --secret-manager-reference github-actions:tijara-ci \
            --secret-rotation-policy-ref docs:DEPLOY.md#secret-handling \
            --secret-access-review-ref docs:DEPLOY.md#secret-handling \
            --strict
      - name: Generate CI sign-off package
        run: |
          TIJARA_SIGNOFF_RUN_ID=ci-local \
          TIJARA_SIGNOFF_ENVIRONMENT=ci \
          TIJARA_SIGNOFF_EVIDENCE_PATHS=deploy/runtime/release-evidence/ci-local,deploy/runtime/release-retention-evidence/ci-local,deploy/runtime/secret-manager-evidence/ci-local \
          TIJARA_SIGNOFF_REQUIRED_EVIDENCE_GROUPS=release,ops,security \
          TIJARA_SIGNOFF_STRICT_REQUIRED_EVIDENCE=1 \
          make signoff-pack
      - name: Check CI release readiness
        run: make check-release-readiness READINESS=deploy/runtime/signoff-packages/ci-local/release-readiness.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tijara-ci-release-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            deploy/runtime/release-evidence/ci-local
            deploy/runtime/release-retention-evidence/ci-local
            deploy/runtime/secret-manager-evidence/ci-local
            deploy/runtime/signoff-packages/ci-local
