map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream tijara_odoo {
    server odoo:8069;
}

upstream tijara_odoo_chat {
    server odoo:8072;
}

limit_req_zone $binary_remote_addr zone=tijara_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tijara_api:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    client_max_body_size 100m;

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

    location ~ ^/(web/login|web/reset_password|web/database) {
        limit_req zone=tijara_login burst=20 nodelay;
        proxy_pass http://tijara_odoo;
    }

    location ~ ^/(jsonrpc|web/dataset|tijara/display|tijara/kiosk) {
        limit_req zone=tijara_api burst=240 nodelay;
        proxy_pass http://tijara_odoo;
    }

    location /longpolling {
        proxy_pass http://tijara_odoo_chat;
    }

    location /websocket {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://tijara_odoo_chat;
    }

    location / {
        proxy_pass http://tijara_odoo;
    }
}
